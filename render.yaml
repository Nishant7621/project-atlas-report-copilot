services:
  - type: web
    name: project-atlas-report-copilot
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python generate_reports.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ATLAS_API_KEY
        value: atlas_secret_key_12345
      - key: CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"
